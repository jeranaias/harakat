[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harakat"
version = "3.5.0"
authors = [
    { name = "Jesse Morgan", email = "jeranaias@gmail.com" }
]
description = "High-accuracy Arabic diacritization (2.29% DER, 99.997% Quran accuracy)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: Arabic",
]
keywords = [
    "arabic",
    "diacritization",
    "nlp",
    "text-processing",
    "harakat",
    "tashkeel",
    "quran",
    "machine-learning",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
]

[project.scripts]
harakat = "harakat:main"

[project.urls]
Homepage = "https://github.com/jeranaias/harakat"
Documentation = "https://github.com/jeranaias/harakat#readme"
Repository = "https://github.com/jeranaias/harakat"
Issues = "https://github.com/jeranaias/harakat/issues"
Demo = "https://jeranaias.github.io/harakat/"
"HuggingFace Space" = "https://huggingface.co/spaces/jcmguy/harakat"

[tool.setuptools]
py-modules = ["harakat", "harakat_v1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["harakat*", "quran*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "setup.py", "examples/*", "experiments/*", "benchmarks/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
